name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate dataset
        run: python tools/validate_data.py data/npdm-metadata.json
      - name: Build data
        run: python tools/build.py --data data/npdm-metadata.json --out site --exports exports
      - name: Verify generated files
        run: python tools/check_generated.py
      - name: Check app syntax
        run: node --check site/app.js
      - name: Run tests
        run: python -m unittest discover -s tests -v
